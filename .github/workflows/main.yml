
name: Repair malformed Git paths

on:
  push:
    branches:
      - repair/malformed-paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove malformed paths
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output([
              "git", "ls-tree", "-r", "-z", "--name-only", "HEAD"
          ])
          paths = [p for p in raw.split(b"\0") if p]
          bad = [
              p for p in paths
              if p.startswith(b"src/") and b'\ncontent":"' in p
          ]

          if not bad:
              raise SystemExit("No matching malformed paths found.")

          for path in bad:
              print("Removing:", repr(path))

          subprocess.run(
              ["git", "update-index", "--force-remove", "-z", "--stdin"],
              input=b"\0".join(bad) + b"\0",
              check=True,
          )
          PY

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Remove malformed source-code paths"

          git push origin HEAD:main

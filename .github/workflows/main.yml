
name: Repair malformed Git paths

on:
  push:
    branches:
      - repair/malformed-paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Git repository
        shell: bash
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin main
          git checkout --orphan repair-work
          git read-tree FETCH_HEAD
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Remove malformed paths and push repair
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          import subprocess

          raw = subprocess.check_output([
              "git", "ls-files", "-z"
          ])
          paths = [p for p in raw.split(b"\0") if p]
          bad = [
              p for p in paths
              if p.startswith(b"src/") and b'\ncontent":"' in p
          ]

          if not bad:
              raise SystemExit("No matching malformed paths found; stopping safely.")

          for path in bad:
              print("Removing malformed path:", repr(path))

          subprocess.run(
              ["git", "update-index", "--force-remove", "-z", "--stdin"],
              input=b"\0".join(bad) + b"\0",
              check=True,
          )
          PY

          git commit -m "Remove malformed source-code paths"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
